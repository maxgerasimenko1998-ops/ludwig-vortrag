<style>
:root{
  --bg:#0c0d10; --panel:#16181d; --line:#2a2e36; --txt:#ececec; --dim:#9aa0aa; --faint:#6b717c;
  --robby:#ff3b3b; --boris:#7cc4ff; --plate:#1e2733; --plate2:#26354a; --play:#e30613;
  --open:#e0b040; --extra:#7fcf9a; --ok:#57c785; --bad:#ff6b5a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px 6px;padding-top:max(8px,env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ttl{font-weight:700;font-size:15px;color:var(--robby);white-space:nowrap}
.ver{font-size:11px;color:var(--faint)}
#mem{color:var(--dim);white-space:nowrap;border:0;background:none;padding:2px 0;font-family:inherit;font-size:12px}
#mem.ok{color:var(--ok)} #mem.bad{color:var(--bad);font-weight:700}
#nav{display:flex;gap:4px;overflow-x:auto;margin-top:6px;padding-bottom:2px;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:1 0 28px;min-width:28px;height:36px;border-radius:8px;border:1px solid var(--line);background:#1c1f26;color:var(--txt);
  font-weight:600;font-size:14px;font-family:inherit;touch-action:manipulation;padding:0}
#nav button.cur{border-color:var(--robby);color:var(--robby)}
#nav button.jk{color:var(--open)}
#scroll{flex:1;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 120px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:22px 0 8px}
.jwrap{border:1px solid var(--line);border-radius:14px;padding:4px 10px 10px;background:#111317;margin-top:12px}
.jwrap h2{margin:10px 2px 6px}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.jb{display:block;width:100%;text-align:left;border:0;border-radius:10px;background:var(--plate);color:var(--txt);padding:8px 10px;min-height:52px;
  font-family:inherit;touch-action:manipulation;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden}
.jb b{display:block;font-size:14px;line-height:1.25}
.jb small{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
section.blk{margin-top:26px}
.bh{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.bh .num{font-weight:800;color:var(--robby);font-size:20px}
.bh .nm{font-weight:700;font-size:18px}
.intro{color:var(--dim);font-size:14px;margin:8px 0 4px;font-style:italic}
.cut .bh .nm::after{content:" · можно пропустить";color:var(--bad);font-size:13px}
.cut .body{opacity:.8}
.cut.open .body{display:block;opacity:.55}
.cue{margin:14px 0 4px;font-size:15px}
.cue .who{color:var(--boris);font-weight:700}
.cue .de{color:var(--boris);font-weight:600}
.cue .ru,.regie .ru{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.regie{margin:6px 0 2px;font-size:14px;font-style:italic;color:var(--open)}
.line{margin:12px 0 6px;font-size:17px}
.line .who{color:var(--robby);font-weight:700}
.line.sub{font-size:15px;color:var(--dim)}
.tag{display:block;width:fit-content;font-size:12px;border-radius:6px;padding:1px 7px;margin:0 0 4px;font-weight:700}
.tag.open{color:#1a1400;background:var(--open)} .tag.extra,.tag.alt{color:#06210f;background:var(--extra)}
.note{font-size:13px;color:var(--open);margin:4px 0 0}
.pl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:12px;background:var(--plate2);color:var(--txt);
  padding:12px;min-height:58px;font-family:inherit;touch-action:manipulation;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden}
.pl.o{background:transparent;border:2px dashed var(--open)}
.pl.x{background:transparent;border:2px dashed var(--extra)}
.pl .ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--robby);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.pl .tx{flex:1;font-size:14px;line-height:1.3}
.pl .mt{flex:none;font-size:12px;color:var(--dim);text-align:right}
.pl .g{display:block;color:var(--open);font-size:11px;margin-top:2px}
.bar{position:absolute;left:0;bottom:0;height:4px;width:0;background:#fff;opacity:.85}
.playing{background:var(--play)!important;color:#fff!important;border-color:var(--play)!important}
.playing .ic{background:#fff;color:var(--play)} .playing small,.playing .mt,.playing .g{color:#ffe3ea!important}
.done:not(.playing){opacity:.55}
.done:not(.playing) .ic{background:var(--ok)}
.jb.done:not(.playing){opacity:.7}
.next:not(.playing){outline:3px solid var(--robby);outline-offset:2px}
.next:not(.playing)::before{content:"дальше ▸";position:absolute;right:8px;top:4px;font-size:10px;color:var(--robby);font-weight:700}
#stop{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;display:none;border:0;border-radius:14px;
  background:#c62828;color:#fff;font-weight:700;font-size:18px;line-height:1.2;font-family:inherit;padding:14px 12px;box-shadow:0 6px 24px #000a;touch-action:manipulation}
#stop small{display:block;font-weight:500;font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#banner{display:none;background:var(--bad);color:#fff;font-weight:700;padding:8px 16px;font-size:14px}
.foot{margin:28px 0 0;color:var(--faint);font-size:12px;text-align:center}
.foot button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:8px 14px;font-family:inherit;margin-bottom:8px}
@media (min-width:700px){ #scroll,header{padding-left:max(16px,calc(50% - 340px));padding-right:max(16px,calc(50% - 340px))} .jgrid{grid-template-columns:1fr 1fr 1fr} }
</style>

<script>
const VERSION = '23.11.2026 Ludwig Vortrag · 1';
const PROIGRYVATEL = true;   // пульт-проигрыватель: только записи, без мозга — proverit_pult.py проверяет его по-своему
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bezTegov = t => String(t).replace(/\[[^\]]*\]\s*/g, '');
const GEST = {'Winken':'машет','Zum Publikum drehen':'к залу','Kopfschütteln':'качает головой','Nicken':'кивает','Tanz kompakt':'танец','Abgang':'уход'};
const fmt = d => (d === undefined || d === null || d === '') ? '' : String(d).replace('.', ',') + ' с';
$('ver').textContent = 'v'+VERSION.split('· ').pop()+' · 23.11';

let SHOW = null, ALL = [];
const player = new Audio();
player.preload = 'auto';
let cur = null, curEls = [], curT = 0, raf = 0;

function banner(t){ const b=$('banner'); b.textContent=t||''; b.style.display=t?'block':'none'; }

// ---- воспроизведение: одна запись за раз ----
function els(id){ return [...document.querySelectorAll('[data-id="'+id+'"]')]; }
function stop(){
  try{ player.pause(); }catch{}
  curEls.forEach(e=>{ e.classList.remove('playing'); const b=e.querySelector('.bar'); if(b) b.style.width='0'; });
  cur=null; curEls=[]; cancelAnimationFrame(raf); $('stop').style.display='none';
}
function tick(){
  if(!cur) return;
  const d = player.duration || cur.dur || 1, w = Math.min(100, (player.currentTime/d)*100) + '%';
  curEls.forEach(e=>{ const b=e.querySelector('.bar'); if(b) b.style.width=w; });
  raf = requestAnimationFrame(tick);
}
function play(p){
  if(cur === p){ if(performance.now()-curT < 1200) return; stop(); return; }   // дрогнул палец — не перезапускать; ещё раз — стоп
  stop();
  cur = p; curT = performance.now(); curEls = els(p.id);
  curEls.forEach(e=>e.classList.add('playing','done'));
  $('stopTx').textContent = bezTegov(p.text);
  $('stop').style.display = 'block';
  if(!p.blob){ stop(); banner('⏳ запись ещё грузится — нажми через секунду'); zagruzit(p).then(()=>banner('')).catch(()=>{}); return; }
  player.src = p.blob;
  const me = p;
  player.play().then(()=>{ if(cur===me) tick(); banner(''); }).catch(e=>{
    if(cur!==me || e?.name==='AbortError') return;
    stop(); banner('⚠️ Запись не сыграла: «' + bezTegov(me.text).slice(0,40) + '…» — нажми ещё раз');
  });
  if(p.kind !== 'joker') markNext(p);
  keepAwake();
}
player.onended = () => stop();
player.onerror = () => { if(cur){ const t=bezTegov(cur.text); stop(); banner('⚠️ Запись не сыграла: «'+t.slice(0,40)+'…» — нажми ещё раз'); } };
$('stop').onclick = stop;

// «дальше ▸» — следующая основная реплика после сыгранной
function markNext(p){
  document.querySelectorAll('.next').forEach(e=>e.classList.remove('next'));
  const order = [...document.querySelectorAll('#script .pl')];
  const i = order.findIndex(e=>e.dataset.id===p.id);
  for(let k=i+1;k<order.length;k++){
    const e=order[k]; if(e.closest('.cut')) continue;
    if(e.dataset.kind==='main'){ e.classList.add('next'); break; }
  }
}

// ---- отрисовка ----
function plate(p){
  const b=document.createElement('button'); b.type='button'; b.dataset.id=p.id; b.dataset.kind=p.kind||'main';
  b.className='pl'+(p.kind==='open'?' o':'')+(p.kind==='extra'||p.kind==='alt'?' x':'');
  const g = GEST[p.gesture] ? '<span class="g">🤖 '+GEST[p.gesture]+'</span>' : '';
  b.innerHTML='<span class="ic">▶</span><span class="tx">'+esc(bezTegov(p.text))+g+'</span><span class="mt">'+fmt(p.dur)+(p.lang==='en'?'<br>EN':'')+'</span><span class="bar"></span>';
  b.onclick=()=>play(p);
  return b;
}
function jokers(where){
  const w=document.createElement('div'); w.className='jwrap'; w.id='jok-'+where;
  Object.entries(SHOW.groups).forEach(([g,name])=>{
    const h=document.createElement('h2'); h.textContent=name; w.appendChild(h);
    const grid=document.createElement('div'); grid.className='jgrid';
    SHOW.joker.filter(j=>j.grp===g).forEach(j=>{
      const b=document.createElement('button'); b.type='button'; b.className='jb'; b.dataset.id=j.id; b.dataset.kind='joker';
      b.innerHTML='<b>'+esc(j.k)+'</b><small>'+esc(bezTegov(j.text))+'</small><span class="bar"></span>';
      b.onclick=()=>play(j); grid.appendChild(b);
    });
    w.appendChild(grid);
  });
  return w;
}
function render(){
  const m=$('scroll'); m.innerHTML='';
  m.appendChild(jokers('top'));
  const sc=document.createElement('div'); sc.id='script'; m.appendChild(sc);
  SHOW.blocks.forEach(b=>{
    const s=document.createElement('section'); s.className='blk'+(b.cut?' cut':''); s.id='b-'+b.id;
    s.innerHTML='<div class="bh"><span class="num">'+esc(b.folie||b.id)+'</span><span class="nm">'+esc(b.ru||b.name)+'</span></div>';
    if(b.cut) s.querySelector('.bh').onclick=()=>s.classList.toggle('open');
    const body=document.createElement('div'); body.className='body'; s.appendChild(body);
    if(b.intro){ const i=document.createElement('div'); i.className='intro'; i.textContent=b.intro; body.appendChild(i); }
    b.phrases.forEach(p=>{
      if(p.cue){ const c=document.createElement('div'); c.className='cue';
        c.innerHTML='<span class="who">БОРИС:</span> '+(p.cue.de?'<span class="de">'+esc(p.cue.de)+'</span><span class="ru">'+esc(p.cue.ru)+'</span>':esc(p.cue.ru)); body.appendChild(c); }
      if(p.regie){ const r=document.createElement('div'); r.className='regie';
        r.innerHTML='🤖 '+esc(p.regie[0])+'<span class="ru">'+esc(p.regie[1])+'</span>'; body.appendChild(r); }
      const l=document.createElement('div'); l.className='line'+(p.kind==='alt'?' sub':'');
      const tag = p.kind==='open' ? '<div class="tag open">↩ если Борис забыл или ушёл в сторону — Робби начинает сам</div>'
                : p.kind==='extra' ? '<div class="tag extra">➕ если зашло — ещё одна</div>'
                : p.kind==='alt' ? '<div class="tag alt">➕ по желанию</div>' : '';
      l.innerHTML=tag+'<span class="who">ЛЮДВИГ:</span> '+esc(p.ru);
      body.appendChild(l);
      body.appendChild(plate(p));
      if(p.note){ const n=document.createElement('div'); n.className='note'; n.textContent='→ '+p.note; body.appendChild(n); }
    });
    sc.appendChild(s);
  });
  m.appendChild(jokers('bottom'));
  const f=document.createElement('div'); f.className='foot';
  f.innerHTML='<button type="button" id="reset">↺ снять отметки ✓ (после пробы)</button><br>'+esc(VERSION)+' · '+ALL.length+' записей · разговора с мозгом нет';
  m.appendChild(f);
  $('reset').onclick=()=>{ document.querySelectorAll('.done,.next').forEach(e=>e.classList.remove('done','next')); };
  // навигация по сценам
  const nav=$('nav'); nav.innerHTML='';
  const go=id=>{ const t=$(id), sc=$('scroll'); if(t){ sc.scrollTop = t.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 6; navCur(); } };   // мгновенно: на сцене плавная прокрутка только мешает
  const add=(t,id,cls)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=t; b.dataset.to=id; if(cls) b.className=cls; b.onclick=()=>go(id); nav.appendChild(b); };
  add('🃏','jok-top','jk');
  SHOW.blocks.forEach(b=>add(String(b.folie||b.id),'b-'+b.id));   // номера слайдов
}
// подсветка текущей сцены в навигации
function navCur(){
  const sc=$('scroll'), y=sc.scrollTop+60; let curId='jok-top';
  ['jok-top',...SHOW.blocks.map(b=>'b-'+b.id),'jok-bottom'].forEach(id=>{ const e=$(id); if(e && e.offsetTop<=y) curId=id; });
  if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-4) curId='jok-bottom';
  if(curId==='jok-bottom') curId='jok-top';   // одна кнопка 🃏 на оба набора джокеров
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('cur',b.dataset.to===curId));
}

// ---- все записи — в память телефона (дальше сеть не нужна) ----
// 14.11 (у Макса пульт «выбросило и перестал работать»): записи и страница кладутся ещё и в хранилище телефона
// (Cache Storage + sw.js) — после первого открытия пульт открывается и играет без интернета, даже если вкладку перезапустило.
const KESH='ct-vortrag-v1';
let kesh=null;
async function otkrytKesh(){ try{ kesh = await caches.open(KESH); }catch{ kesh=null; } }
function sTaimautom(url, ms, opt={}){ const ac=new AbortController(); const t=setTimeout(()=>ac.abort(), ms);
  return fetch(url,{...opt, signal:ac.signal}).finally(()=>clearTimeout(t)); }
async function zagruzit(p){
  const url = new URL(p.file+'?h='+(p.h||'')+'&a=2', location.href).href;
  let r=null;
  try{ r = kesh ? await kesh.match(url) : null; }catch{ r=null; }
  if(!r){ r = await sTaimautom(url, 20000); if(!r.ok) throw new Error(r.status); try{ if(kesh) await kesh.put(url, r.clone()); }catch{} }
  p.blob = URL.createObjectURL(new Blob([await rasshifr(KLUCH, await r.arrayBuffer())], {type:'audio/mpeg'}));
}
async function stranicuVPamyat(){ try{ if(!kesh) return; const r=await sTaimautom('./', 20000, {cache:'no-store'});
  if(r.ok) await kesh.put(new URL('./', location.href).href, r); }catch{} }
let memOk=0, memBad=0;
function memShow(){ const m=$('mem');
  m.className = memBad ? 'bad' : (memOk===ALL.length ? 'ok' : '');
  m.textContent = memBad ? '⚠️ '+memBad+' не скачались — нажми' : (memOk===ALL.length ? '🎧 все '+ALL.length+' в памяти' : '🎧 '+memOk+' из '+ALL.length+'…'); }
function vPamyat(){
  const todo=ALL.filter(p=>!p.blob && !p._idet);
  memBad=0; memOk=ALL.filter(p=>p.blob).length; memShow();
  todo.forEach(p=>{ p._idet=true;
    zagruzit(p).then(()=>{ memOk++; }).catch(()=>{ memBad++; }).finally(()=>{ p._idet=false; memShow(); });
  });
}
$('mem').onclick=()=>vPamyat();
window.addEventListener('online',()=>{ if(ALL.some(p=>!p.blob)) vPamyat(); });

// ---- экран не гаснет ----
let wakeLock=null;
async function keepAwake(){ if(wakeLock) return; try{ wakeLock=await navigator.wakeLock?.request('screen'); wakeLock?.addEventListener?.('release',()=>{ wakeLock=null; }); }catch{} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepAwake(); });

// ---- пароль: сценарий и записи зашифрованы (NDA заказчика), ключ из пароля, пароль живёт в памяти телефона ----
const b64u8 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
let KLUCH = null;
async function kluch(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64u8(window.SHOW_ENC.salt), iterations:window.SHOW_ENC.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function rasshifr(k, buf){ const u=new Uint8Array(buf); return crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(0,12)}, k, u.slice(12)); }
async function otkryt(pw){
  const k = await kluch(pw);
  const t = new TextDecoder().decode(await rasshifr(k, b64u8(window.SHOW_ENC.data).buffer));
  KLUCH = k; return JSON.parse(t);
}
function sprositParol(){
  return new Promise(res=>{
    const w=document.createElement('div');
    w.style.cssText='position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px';
    const i=document.createElement('input'); i.type='password'; i.placeholder='пароль'; i.autocomplete='current-password';
    i.style.cssText='font-size:20px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--txt);width:min(320px,90vw)';
    const b=document.createElement('button'); b.type='button'; b.textContent='Открыть доклад';
    b.style.cssText='font-size:18px;font-weight:700;padding:12px 20px;border:0;border-radius:10px;background:var(--play);color:#fff';
    const e=document.createElement('div'); e.style.cssText='color:var(--bad);min-height:20px';
    const h=document.createElement('div'); h.textContent='🔒 Ludwig · доклад'; h.style.cssText='font-size:18px;font-weight:700';
    const go=async()=>{ try{ const s=await otkryt(i.value.trim()); try{ localStorage.setItem('ctv:pw', i.value.trim()); }catch{} w.remove(); res(s); }
                        catch{ e.textContent='неверный пароль'; } };
    b.onclick=go; i.onkeydown=ev=>{ if(ev.key==='Enter') go(); };
    w.append(h,i,b,e); document.body.appendChild(w); i.focus();
  });
}
(async()=>{
  if(!window.SHOW_ENC){ banner('⚠️ Сценарий не вшит в страницу — python3 scripts/vortrag_ozvuchka.py <робот> --sobrat'); return; }
  if(!crypto?.subtle){ banner('⚠️ Браузер не умеет расшифровку — открой по https в Chrome/Safari'); return; }
  let pw=null; try{ pw=localStorage.getItem('ctv:pw'); }catch{}
  try{ SHOW = pw ? await otkryt(pw) : null; }catch{ SHOW=null; }
  if(!SHOW) SHOW = await sprositParol();
  ALL = [...SHOW.blocks.flatMap(b=>b.phrases), ...SHOW.joker].filter(p=>p.file);
  render(); keepAwake();
  $('scroll').addEventListener('scroll',navCur,{passive:true}); navCur();
  await otkrytKesh(); vPamyat(); stranicuVPamyat();
  try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch{}
  window.__robby = { ALL, play, stop, state:()=>({cur:cur?cur.id:null, paused:player.paused, mem:ALL.filter(p=>p.blob).length}) };
})();
</script>
